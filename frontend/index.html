<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gamer Profile</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>

  <body class="bg-light">
    <div class="container py-4" style="max-width: 1200px">
      <header class="mb-4 text-center">
        <h1 class="display-6">🎮 Gamer Profile</h1>
        <p class="text-muted">Gerencie sua biblioteca pessoal de jogos</p>

        <div id="alerta" class="alert alert-danger d-none" role="alert"></div>
      </header>

      <div class="row g-4">
        <!-- ===================== USERS ===================== -->

        <section class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white fw-bold">
              Usuários
            </div>

            <div class="card-body">
              <form id="form-user" class="row g-2 mb-3">
                <div class="col-12">
                  <input
                    type="text"
                    id="user-nome"
                    class="form-control"
                    placeholder="Nome"
                    required
                  />
                </div>

                <div class="col-12">
                  <input
                    type="email"
                    id="user-email"
                    class="form-control"
                    placeholder="E-mail"
                    required
                  />
                </div>

                <div class="col-12">
                  <input
                    type="password"
                    id="user-senha"
                    class="form-control"
                    placeholder="Senha"
                    required
                  />
                </div>

                <div class="col-12">
                  <button type="submit" class="btn btn-primary w-100">
                    Cadastrar Usuário
                  </button>
                </div>
              </form>

              <ul id="lista-users" class="list-group"></ul>
            </div>
          </div>
        </section>

        <!-- ===================== GAMES ===================== -->

        <section class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-header bg-success text-white fw-bold">Jogos</div>

            <div class="card-body">
              <form id="form-game" class="row g-2 mb-3">
                <div class="col-12">
                  <input
                    type="text"
                    id="game-titulo"
                    class="form-control"
                    placeholder="Título"
                    required
                  />
                </div>

                <div class="col-12">
                  <textarea
                    id="game-descricao"
                    class="form-control"
                    rows="1"
                    placeholder="Descrição"
                    required
                  ></textarea>
                </div>

                <div class="col-6">
                  <input
                    type="text"
                    id="game-genero"
                    class="form-control"
                    placeholder="Gênero"
                    required
                  />
                </div>

                <div class="col-6">
                  <input
                    type="date"
                    id="game-data"
                    class="form-control"
                    required
                  />
                </div>

                <div class="col-12">
                  <button type="submit" class="btn btn-success w-100">
                    Cadastrar Jogo
                  </button>
                </div>
              </form>

              <ul id="lista-games" class="list-group"></ul>
            </div>
          </div>
        </section>

        <!-- ===================== REVIEWS ===================== -->

        <section class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-header bg-warning fw-bold">Reviews</div>

            <div class="card-body">
              <form id="form-review" class="row g-2 mb-3">
                <div class="col-12">
                  <select id="review-user" class="form-select" required>
                    <option value="">Selecione um usuário...</option>
                  </select>
                </div>

                <div class="col-8">
                  <select id="review-game" class="form-select" required>
                    <option value="">Selecione um jogo...</option>
                  </select>
                </div>

                <div class="col-4">
                  <input
                    type="number"
                    id="review-nota"
                    class="form-control"
                    placeholder="Nota"
                    min="0"
                    max="10"
                  />
                </div>

                <div class="col-12">
                  <textarea
                    id="review-comentario"
                    class="form-control"
                    rows="1"
                    placeholder="Comentário"
                    required
                  ></textarea>
                </div>

                <div class="col-12">
                  <button type="submit" class="btn btn-warning w-100">
                    Adicionar Review
                  </button>
                </div>
              </form>

              <ul id="lista-reviews" class="list-group"></ul>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
